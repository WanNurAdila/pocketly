name: Test Robot Framework on Push

on:
  push:
    branches: [robot-automated-testing, main]
  pull_request:
    branches: [main]

jobs:
  robot-tests:
    name: Robot Framework Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for site to be reachable
        run: |
          URL="https://pocketly-budgeting.vercel.app"
          echo "Waiting for $URL to respond..."
          for i in {1..30}; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
            if [[ "$STATUS" =~ ^(2|3)[0-9][0-9]$ ]]; then
              echo "✅ Site is live (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Site did not become reachable"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: rfbrowser init chromium

      - name: Run Robot Framework tests
        run: |
          robot --outputdir results \
                --variable "BASE_URL:https://pocketly-budgeting.vercel.app" \
                --variable HEADLESS:True \
                --include smoke \
                robot-tests/suites/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
          retention-days: 14
