name: PR Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  robot-tests:
    name: Robot Framework Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Vercel preview URL
        id: vercel_preview
        uses: zentered/vercel-preview-url@v1.4.0
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait for deployment to be reachable
        run: |
          URL="https://${{ steps.vercel_preview.outputs.preview_url }}"
          echo "Waiting for $URL to respond..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
              "$URL")
            # Anything in 2xx or 3xx is fine — deployment is responding
            if [[ "$STATUS" =~ ^(2|3)[0-9][0-9]$ ]]; then
              echo "✅ Deployment is live (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Deployment did not become reachable"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: rfbrowser init chromium

      - name: Run Robot Framework tests
        run: |
          robot --outputdir results \
                --variable BASE_URL:https://${{ steps.vercel_preview.outputs.preview_url }} \
                --variable HEADLESS:True \
                --include smoke \
                tests/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
          retention-days: 14
